name: GitHub Pages

on:
  push:
    branches:
      - main
      - app-rewrite
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-simulator:
    runs-on: ubuntu-latest
    container:
      image: emscripten/emsdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Ensure workspace directory is defined as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Compile sensorwatch_pro custom simulator
        run: emmake make BOARD=sensorwatch_pro DISPLAY=custom BIN=${{ github.ref_name }}-firmware
      - name: Upload simulator
        uses: actions/upload-artifact@v4
        with:
          name: sensorwatch-pro-custom-simulator
          path: |
            build-sim/${{ github.ref_name }}-firmware.html
            build-sim/${{ github.ref_name }}-firmware.js
            build-sim/${{ github.ref_name }}-firmware.wasm

  gh-pages:
    needs: build-simulator
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Doxygen Action
        uses: mattnotmitt/doxygen-action@v1
      - name: Prepare Pages site
        run: |
          mkdir -p site
          cp -R docs/. site/
      - name: Download simulator
        uses: actions/download-artifact@v4
        with:
          name: sensorwatch-pro-custom-simulator
          path: site/simulator
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
